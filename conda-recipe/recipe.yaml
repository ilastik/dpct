schema_version: 1

context:
  version: 1.7.0
  lemon: ${{ lemon }}

source:
  path: ..

outputs:
  - package:
      name: libdpct
      version: ${{ version }}

    build:
      number: 0
      script:
        - if: not win
          then: ${RECIPE_DIR}/build.sh
          else: "%RECIPE_DIR%\\build.bat"

    requirements:
      build:
        - cmake
        - if: not win
          then:
            - make
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
      host:
        - jsoncpp
        - lemon
      run_exports:
        weak:
          - ${{ pin_subpackage("libdpct", exact=True) }}

    tests:
      - package_contents:
          include:
            - dpct/*.h
          lib:
            - dpct

      - script:
        - cmake-package-check dpct --targets dpct::dpct
        requirements:
          run:
            - cmake-package-check
            - ${{ compiler("c") }}
            - ${{ compiler("cxx") }}

      - script:
        - if: not win
          then: build-test.sh
          else: build-test.bat"
        files:
          source:
            - test/
            - CMakeLists.txt
          recipe:
          - if: not win
            then:
              - build-test.sh
              - build.sh
            else:
              - build-test.bat
              - build.bat
        requirements:
          build:
            - libboost-devel
            - cmake
            - if: not win
              then:
                - make
            - ${{ compiler("c") }}
            - ${{ compiler("cxx") }}

  - package:
      name: dpct
      version: ${{ version }}

    build:
      number: 0
      script:
        - if: not win
          then: ${RECIPE_DIR}/build-python.sh
          else: "%RECIPE_DIR%\\build-python.bat"

    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - cross-python_${{ target_platform }}
            - python
            - cython
        - cmake
        - if: not win
          then:
            - make
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
      host:
        - pybind11
        - lemon
        - python
        - ${{ pin_subpackage("libdpct", exact=True) }}
      run:
        - python
        - ${{ pin_subpackage("libdpct", upper_bound="x.x") }}

    tests:
      - script:
          - python test/test.py
        files:
          source:
            - test/*.py
            - test/*.json

      - python:
          imports:
            - dpct

about:
  homepage: https://github.com/ilastik/dpct
  license: MIT
  summary: Dynamic Programming Cell Tracking Solver Library
  license_file:
    - LICENSE
