name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-w-conda-recipe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          auto-activate: true
          activate-environment: bld-env
          environment-file: .github/workflows/etc/build-environment.yml
          channel-priority: strict
          miniforge-version: latest
          conda-solver: libmamba
          conda-remove-defaults: true
      - name: linux conda build
        if: matrix.os == 'ubuntu-latest'
        shell: bash -l {0}
        run: rattler-build build -c conda-forge -r conda-recipe/recipe.yaml
      - name: osx conda build
        if: matrix.os == 'macos-latest'
        shell: bash -l {0}
        run:  rattler-build build -c conda-forge -r conda-recipe/recipe.yaml
      - name: windows conda build
        if: matrix.os == 'windows-latest'
        shell: cmd /C CALL {0}
        # keep build as a workaround for tests failing otherwise when rattler-build removes temp files
        run: rattler-build build --keep-build -c conda-forge -r conda-recipe\recipe.yaml

